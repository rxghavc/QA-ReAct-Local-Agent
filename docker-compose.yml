services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - BROWSER_SERVICE_URL=http://browser:8001
    depends_on:
      - browser

  browser:
    build:
      context: .
      dockerfile: browser/Dockerfile
    ports:
      - "8001:8001"